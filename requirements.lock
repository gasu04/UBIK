# =============================================================================
# UBIK canonical venv — frozen dependency manifest (CLAUDE.md §2.7)
# =============================================================================
# Generated: 2026-07-27, via `uv pip freeze --python .venv/bin/python`
# Source venv: /Volumes/990PRO 4T/UBIK/.venv (Python 3.13.7) — the single
# shared venv for maestro and hippocampal (CLAUDE.md §3.5). One combined lock
# file rather than a per-subproject split — they share one venv, so a split
# would just be identical duplicate files.
#
# Built from ONLY `maestro/requirements.txt` + `hippocampal/requirements.txt`.
# The top-level `requirements.txt` is Somatic/DeepSeek-flavored (ML training
# stack — torch, transformers, trl, peft, accelerate, bitsandbytes, datasets,
# wandb, tensorboard, jupyter, etc.) and is deliberately NOT installed here
# (see "torch pollution" note below). `ingestion/requirements.txt` is also not
# installed here yet — see the open item below.
#
# Regenerate after any dependency change:
#   uv pip install --python "/Volumes/990PRO 4T/UBIK/.venv/bin/python" \
#       -r maestro/requirements.txt -r hippocampal/requirements.txt
#   uv pip freeze --python "/Volumes/990PRO 4T/UBIK/.venv/bin/python" \
#       > "/Volumes/990PRO 4T/UBIK/requirements.lock"
#
# Does NOT cover the Somatic-node venvs (pytorch_env_vllm024, ubik-whisperx-venv)
# or the DeepSeek venv — those are separate environments; see ENVIRONMENT.md.
#
# "torch pollution" fix (2026-07-27): a prior venv build included the
# top-level `requirements.txt` (headed "PowerSpec AI100 - RTX 5090 - CUDA
# 12.4" — Somatic hardware, not Hippocampal) per an outdated CLAUDE.md §3.5
# rebuild command. That pulled in the full ML-training stack (258 packages
# total). Rebuilt from just maestro+hippocampal requirements (155 packages);
# `torch` itself remains — it's a genuine transitive dependency of
# `sentence-transformers` (hippocampal's embeddings), not training-stack
# leakage. Verified: maestro (649 tests) and hippocampal (139 passed / 15
# skipped) both green under the rebuilt venv; `hippocampal.mcp_server`
# (Tier 1) import smoke-tested OK. The old venv is preserved at
# `.venv.pre-torch-cleanup-backup/` (gitignored) pending confirmation this
# is stable, then it can be deleted.
#
# OPEN ITEM (not resolved here): `ingestion/requirements.txt` lists
# `openai-whisper` (imported directly in `ingestion/ingest/processors.py`),
# which pulls in its own torch stack. None of ingestion's packages
# (openai-whisper, pdfplumber, google-auth, etc.) are currently installed in
# this venv at all — a pre-existing gap unrelated to this fix. Whether
# ingestion's local whisper usage should stay local (accept the torch/whisper
# weight here) or be redirected to the remote Somatic WhisperX service (per
# the original Layer E intent to keep whisper off Hippocampal) is a design
# decision for a future session, not a dependency-pinning task.
